name: affiliateo
description: Mobile affiliate attribution and session tracking for Flutter apps.
# 4.3.0: version alignment — every Affiliateo SDK (web, React Native,
# Swift, Kotlin, Flutter) now ships the same version number. Identical
# source to 3.1.0.
# 3.1.0: Play Install Referrer capture — the SDK reads Google's install
# referrer once on first launch (Android) and sends it with /identify, so a
# paid-ad install (Meta / TikTok / Google Ads) gets its source labelled
# server-side with zero merchant work. Additive, no API changes.
# 3.0.0: event queue + reset/optOut/optIn/flush + TrackedScreen widget.
version: 4.3.0
homepage: https://affiliateo.com
repository: https://github.com/affiliateo/affiliateo-flutter

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  device_info_plus: ^9.0.0
  package_info_plus: ^5.0.0
  shared_preferences: ^2.2.0
  # New in 3.0.0: needed by EventQueue to pause flushing when offline
  # and trigger an immediate retry when the network returns. Mirrors
  # @react-native-community/netinfo in the RN SDK.
  connectivity_plus: ^5.0.0
  # New in 3.1.0: reads the Play Install Referrer (Android) so paid-ad
  # installs get their source labelled. Throws on iOS — guarded by a
  # Platform.isAndroid check.
  android_play_install_referrer: ^0.4.0
