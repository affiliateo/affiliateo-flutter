name: affiliateo
description: Mobile affiliate attribution and session tracking for Flutter apps.
# 3.0.0: event queue + reset/optOut/optIn/flush + TrackedScreen widget.
# Matches the @affiliateo/react-native 4.0.0 + @affiliateo/web 3.0.0 +
# affiliateo-swift + affiliateo-kotlin 3.0.0 parity work shipped at the
# same time. Adds connectivity_plus as a required dependency so the
# queue can detect network outages and pause flushing instead of
# burning retry slots on doomed requests.
version: 3.0.0
homepage: https://affiliateo.com
repository: https://github.com/affiliateo/affiliateo-flutter

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  device_info_plus: ^9.0.0
  package_info_plus: ^5.0.0
  shared_preferences: ^2.2.0
  # New in 3.0.0: needed by EventQueue to pause flushing when offline
  # and trigger an immediate retry when the network returns. Mirrors
  # @react-native-community/netinfo in the RN SDK.
  connectivity_plus: ^5.0.0
